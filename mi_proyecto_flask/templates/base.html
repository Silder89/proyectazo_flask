<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mi proyecto{% endblock %}</title>
{{ bootstrap.load_css() }}
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
<div class="container">
<a class="navbar-brand" href="{{ url_for('index') }}">Mi proyecto</a>
<div class="navbar-nav">
<a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
<a class="nav-link" href="{{ url_for('about') }}">Acerca de</a>
<a class="nav-link" href="{{ url_for('contacto') }}">Contacto</a>
</div>
</div>
</nav>
<main class="container py-4">
{% with mensajes = get_flashed_messages(with_categories=true) %}
{% for categoria, mensaje in mensajes %}
<div class="alert alert-{{ categoria }}" role="alert">{{ mensaje
}}</div>
{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
{{ bootstrap.load_js() }}
</body>
</html>
